<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="header-brand">
        <img class="brand-mark" src="icons/icon32.png" width="26" height="26" alt="" />
        <div class="brand-text">
          <h1>Tulbelt</h1>
          <p class="subtitle">tulip.co tweaks</p>
        </div>
      </div>
      <nav class="header-links" aria-label="Links">
        <a id="options-link" href="#" hidden aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0a8.2 8.2 0 0 1 .7.03l.35 1.72a6 6 0 0 1 1.52.63l1.46-.97c.37.29.7.62.99.99l-.97 1.46c.27.47.48.98.63 1.52L14.4 5.7a8.2 8.2 0 0 1 0 1.4v1.2l-1.72.35a6 6 0 0 1-.63 1.52l.97 1.46c-.29.37-.62.7-.99.99l-1.46-.97a6 6 0 0 1-1.52.63L8.7 13.97a8.2 8.2 0 0 1-1.4 0l-.35-1.72a6 6 0 0 1-1.52-.63l-1.46.97a6.2 6.2 0 0 1-.99-.99l.97-1.46a6 6 0 0 1-.63-1.52L1.6 8.27a8.2 8.2 0 0 1 0-1.4l1.72-.35c.15-.54.36-1.05.63-1.52l-.97-1.46c.29-.37.62-.7.99-.99l1.46.97c.47-.27.98-.48 1.52-.63L7.3.03A8.2 8.2 0 0 1 8 0Zm0 4.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"
            />
          </svg>
        </a>
        <a
          href="https://github.com/dapomeranz/tulbelt"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="View on GitHub"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
            />
          </svg>
        </a>
        <a
          id="feedback-link"
          href="https://github.com/dapomeranz/tulbelt/issues/new/choose"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Report a bug or suggest a feature"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="currentColor"
              d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm0-8a7 7 0 1 1-3.18 13.23l-2.4.8a.75.75 0 0 1-.93-.93l.8-2.4A7 7 0 0 1 8 1.5Z"
            />
          </svg>
        </a>
      </nav>
    </header>
    <div class="search-bar">
      <input
        type="search"
        id="feature-search"
        placeholder="Search toggles…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    <div class="bulk-actions">
      <button type="button" id="all-off">All Off</button>
      <button type="button" id="restore-defaults" class="bulk-trailing">Restore Defaults</button>
    </div>
    <ul id="toggles"></ul>
    <p id="no-results" class="no-results" hidden>No matching toggles</p>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
